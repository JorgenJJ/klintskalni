# =============================================================================
#  Sveltia CMS – konfigurasjon (jf. rapportens kap. 2.6)
# =============================================================================
#  Skjema-grensesnitt for å redigere tekst, bilder og anmeldelser i nettleseren.
#  Endringer lagres som vanlige Git-commits, som trigger Cloudflare-bygget.
#
#  VIKTIG, gjør dette selv (for redigering på nett):
#   1. Bytt `repo:` under til ditt GitHub-bruker/repo hvis det avviker.
#   2. Sett `branch:` til den grenen Cloudflare Pages bygger fra (oftest `main`).
#   3. Logg inn på /admin med et fine-grained Personal Access Token (PAT) som
#      KUN har tilgang til dette repoet, med "Contents: Read and write".
#      Tokenet lagres lokalt i nettleseren – det committes ALDRI til repoet.
#
#  TESTE LOKALT (uten PAT): kjør `npm run dev`, åpne http://localhost:4321/admin
#  i Chrome/Edge og velg «Work with Local Repository» → pek på prosjektmappen.
#  Endringer skrives da rett til filene i arbeidskopien din.
# =============================================================================

backend:
  name: github
  repo: jorgenjj/klintskalni
  branch: main

# Bilder lastes opp hit (der Astro optimaliserer dem ved bygg).
media_folder: "src/images"
public_folder: "/src/images"

# -----------------------------------------------------------------------------
#  Flerspråk: «Sideinnhold» er ETT skjema der språkene redigeres side om side.
#  Norsk (`no`) er KILDESPRÅKET (se `default_locale` under): du redigerer norsk
#  og fyller engelsk + latvisk med Sveltias «Translate»-knapp (AI-oversetting).
#  Felt merket `i18n: true` oversettes per språk; felt merket `i18n: duplicate`
#  redigeres kun i kildespråket og holdes automatisk identiske i alle språk
#  (f.eks. hus-ID). NB: hvert felt MÅ ha et i18n-flagg – felt uten flagg skjules
#  og lagres ikke for andre språk enn kildespråket.
#
#  AI-OVERSETTING: «Translate»-knappen (i skjematoppen eller per felt) krever en
#  gratis API-nøkkel (f.eks. Mistral) som limes inn ÉN gang og lagres kun i
#  nettleseren – den committes aldri, og den publiserte siden forblir nøkkel- og
#  sporingsfri. Toppknappen fyller kun TOMME felt; bruk felt-knappen for å
#  overskrive tekst du har endret. Mer i README.
#
#  NYTT SPRÅK: legg koden til i `locales` under (og i src/i18n/languages.ts),
#  og kopier src/content/sections/no.md til <kode>.md som utgangspunkt.
# -----------------------------------------------------------------------------
i18n:
  structure: multiple_files
  locales: [en, no, lv]
  default_locale: "no"      # norsk er kildespråket (var: en); «Translate» oversetter FRA norsk.
                            # NB: sitér "no" – bar `no` tolkes som boolsk false i YAML 1.1.

collections:
  # ---------------------------------------------------------------------------
  #  Sideinnhold (tekst) – src/content/sections/<lang>.md
  #  Én oppføring for alle språk ({{locale}} i filstien).
  #
  #  GRUPPER: feltene er samlet i fem sammenleggbare `object`-grupper (hero,
  #  about, houses, nearby, general). Sveltia har ingen rent visuell gruppering, så
  #  gruppa ER datastrukturen: nøklene ligger nøstet under gruppenavnet i
  #  frontmatteret, og src/content.config.ts speiler den samme strukturen.
  #  Unntak: «Om»-brødteksten (`body`) er markdown-body-en i filen, og body
  #  støttes bare på toppnivå – derfor står den utenfor `about`-gruppa.
  # ---------------------------------------------------------------------------
  - name: "sections"
    label: "Sideinnhold (tekst)"
    i18n: true
    files:
      - name: "sections"
        label: "Alle seksjoner (alle språk)"
        file: "src/content/sections/{{locale}}.md"
        i18n: true
        fields:
          # --- Gruppe 1: Overskrift og introduksjon (øverst på siden) ---------
          - label: "Overskrift og introduksjon"
            name: "hero"
            widget: "object"
            i18n: true
            fields:
              # Tittelen ER eiendomsnavnet, et egennavn. `i18n: duplicate` gjør
              # at den redigeres kun på norsk og holdes lik overalt – da kan
              # ikke «Translate»-knappen skrive den om.
              - { label: "Tittel (eiendomsnavn, likt på alle språk)", name: "title", widget: "string", i18n: duplicate }
              - { label: "Undertekst", name: "tagline", widget: "string", i18n: true }
              - { label: "Bildebeskrivelse (alt)", name: "alt", widget: "string", required: false, i18n: true }
              - { label: "Knapp (ruller ned til husene)", name: "ctaLabel", widget: "string", i18n: true }

          # --- Gruppe 2: Om Klintskalni --------------------------------------
          #  NB: selve brødteksten er markdown-body-en i filen og kan derfor
          #  ikke ligge inne i gruppa – den står som eget felt rett under.
          - label: "Om Klintskalni"
            name: "about"
            widget: "object"
            i18n: true
            fields:
              - { label: "Tittel", name: "title", widget: "string", required: false, i18n: true }
              - { label: "E-postlinje (nederst, «du kan også booke på e-post:»)", name: "emailNote", widget: "string", required: false, i18n: true }
          - { label: "Om Klintskalni – brødtekst", name: "body", widget: "markdown", i18n: true }

          # --- Gruppe 3: Husbeskrivelser -------------------------------------
          - label: "Husbeskrivelser"
            name: "houses"
            widget: "object"
            i18n: true
            fields:
              - { label: "Skjult seksjonsetikett (kun for skjermlesere)", name: "title", widget: "string", required: false, i18n: true }
              - label: "Huset og hytta (tekst – bilde/Airbnb-lenke ligger i «Husene»)"
                name: "items"
                widget: "list"
                required: false
                i18n: true
                fields:
                  # ID-en holdes automatisk lik i alle språk (i18n: duplicate).
                  - { label: "Enhet (må matche «Husene»)", name: "id", widget: "select", options: ["house", "cottage"], i18n: duplicate }
                  - { label: "Navn", name: "name", widget: "string", i18n: true }
                  - { label: "Kort undertekst", name: "tagline", widget: "string", required: false, i18n: true }
                  - label: "Nøkkelpunkter for enheten"
                    name: "keyPoints"
                    widget: "list"
                    required: false
                    i18n: true
                    fields:
                      - { label: "Ikon (emoji)", name: "icon", widget: "string", default: "•", i18n: true }
                      - { label: "Tekst", name: "label", widget: "string", i18n: true }
                  - { label: "Beskrivelse", name: "description", widget: "text", required: false, i18n: true }
                  - { label: "Knapp: Book på Airbnb", name: "bookLabel", widget: "string", i18n: true }
                  - { label: "Bildebeskrivelse (alt)", name: "imageAlt", widget: "string", required: false, i18n: true }
              - { label: "Knapp: Se bilder", name: "photosButtonLabel", widget: "string", required: false, default: "Se bilder", i18n: true }
              - { label: "Lukk-knapp (bildevisning)", name: "closeLabel", widget: "string", required: false, default: "Lukk", i18n: true }

          # --- Gruppe 4: I nærheten ------------------------------------------
          #  NB: stedsNAVN ligger IKKE her. De ligger i «Nærområdet»
          #  (src/data/nearby.json), en collection UTEN i18n, som «Translate»-
          #  knappen derfor aldri ser. Her ligger kun oversettbar tekst, koblet
          #  til stedet via `id`.
          - label: "I nærheten"
            name: "nearby"
            widget: "object"
            i18n: true
            fields:
              - { label: "Tittel", name: "title", widget: "string", required: false, i18n: true }
              - { label: "Introtekst (valgfri)", name: "intro", widget: "text", required: false, i18n: true }
              - { label: "Lenketekst nederst i hvert kort (f.eks. «Åpne i Google Maps»)", name: "linkLabel", widget: "string", required: false, i18n: true, hint: "Skrives ÉN gang og gjelder alle steder. Vises kun på steder som har en lenke." }
              - label: "Kategorinavn"
                name: "categoryLabels"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Butikker", name: "shop", widget: "string", required: false, i18n: true }
                  - { label: "Mat og drikke", name: "restaurant", widget: "string", required: false, i18n: true }
                  - { label: "Aktiviteter og severdigheter", name: "activity", widget: "string", required: false, i18n: true }
              - label: "Valgfrie beskrivelser (navn, avstand og lenke ligger i «Nærområdet»)"
                name: "items"
                widget: "list"
                required: false
                i18n: true
                hint: "Skriv IKKE stedsnavn her – de ligger i «Nærområdet» og oversettes aldri. Én kort setning holder. Legg til, fjern og omorganiser steder i NORSK-fanen."
                fields:
                  # ID-en holdes automatisk lik i alle språk (i18n: duplicate).
                  - { label: "ID (må matche «Nærområdet»)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "Kun små bokstaver, tall og bindestrek"], i18n: duplicate }
                  - { label: "Kort beskrivelse", name: "description", widget: "string", required: false, i18n: true }

          # --- Gruppe 5: Titler og annen tekst (resten av siden) -------------
          - label: "Titler og annen tekst"
            name: "general"
            widget: "object"
            collapsed: true
            i18n: true
            fields:
              - { label: "Omgivelsene – skjult seksjonsetikett (kun for skjermlesere)", name: "galleryTitle", widget: "string", required: false, i18n: true }
              - label: "Omgivelsene – bildebeskrivelser (alt), i samme rekkefølge som bildene"
                name: "galleryAlts"
                widget: "list"
                required: false
                i18n: true
                field: { label: "Bildebeskrivelse", name: "alt", widget: "string" }
              - { label: "Anmeldelser – tittel", name: "reviewsTitle", widget: "string", required: false, i18n: true }
              - { label: "Anmeldelser – merknad (f.eks. ★ 5,0 på Airbnb)", name: "reviewsNote", widget: "string", required: false, i18n: true }
              - { label: "Anmeldelser – lenketekst", name: "reviewsLinkLabel", widget: "string", required: false, i18n: true }
              - { label: "Kart – tittel", name: "mapTitle", widget: "string", required: false, i18n: true }
              - { label: "Kart – områdenavn", name: "mapAreaLabel", widget: "string", required: false, i18n: true }
              - { label: "Kart – lenketekst", name: "mapLinkLabel", widget: "string", required: false, i18n: true }
              - { label: "Kontakt – tittel", name: "contactTitle", widget: "string", required: false, i18n: true }
              - { label: "Kontakt – tekst", name: "contactText", widget: "text", required: false, i18n: true }
              - { label: "Knapp: Send e-post", name: "emailButtonLabel", widget: "string", required: false, i18n: true }
              - { label: "SEO – sidetittel", name: "seoTitle", widget: "string", i18n: true }
              - { label: "SEO – beskrivelse", name: "seoDescription", widget: "text", i18n: true }
              - { label: "Språkvelger-etikett", name: "languageLabel", widget: "string", required: false, default: "Language", i18n: true }
              - { label: "«Hopp til innhold»-tekst", name: "skipToContent", widget: "string", required: false, default: "Skip to content", i18n: true }
              - { label: "Innholdsmeny – skjult etikett (kun for skjermlesere)", name: "tocLabel", widget: "string", required: false, default: "Contents", i18n: true, hint: "Punktene i menyen henter navn fra seksjonstitlene, så de trenger ingen egne felt." }

  # ---------------------------------------------------------------------------
  #  Innstillinger – FELLES for alle språk. src/data/site.json
  #  (Eiendomsnavnet er et egennavn og oversettes ikke.)
  # ---------------------------------------------------------------------------
  - name: "site"
    label: "Innstillinger (felles)"
    files:
      - name: "site"
        label: "Eiendomsnavn og kart"
        file: "src/data/site.json"
        fields:
          - { label: "Husnavn / eiendomsnavn", name: "houseName", widget: "string" }
          - label: "Kart"
            name: "map"
            widget: "object"
            fields:
              - { label: "Breddegrad (lat)", name: "lat", widget: "number", value_type: "float" }
              - { label: "Lengdegrad (lon)", name: "lon", widget: "number", value_type: "float" }
              - { label: "Områdestørrelse (grader)", name: "areaSpan", widget: "number", value_type: "float", default: 0.06 }
              - { label: "Vis nøyaktig nål?", name: "showMarker", widget: "boolean", default: false }

  # ---------------------------------------------------------------------------
  #  De to husene – FELLES (bilde + Airbnb-lenke). Tekst ligger i «Sideinnhold».
  #  src/data/houses.json. `id` kobler tekst og data sammen (house / cottage).
  # ---------------------------------------------------------------------------
  - name: "houses"
    label: "Husene (bilde + Airbnb-lenke)"
    files:
      - name: "houses"
        label: "Huset og hytta"
        file: "src/data/houses.json"
        fields:
          - label: "Hus"
            name: "houses"
            widget: "list"
            fields:
              - { label: "Enhet (må matche teksten i Sideinnhold)", name: "id", widget: "select", options: ["house", "cottage"] }
              - { label: "Airbnb-lenke", name: "airbnbUrl", widget: "string" }
              - { label: "Antall gjester (for søkemotorer)", name: "guests", widget: "number", required: false }
              - { label: "Antall soverom (for søkemotorer)", name: "bedrooms", widget: "number", required: false }
              - { label: "Antall senger (for søkemotorer)", name: "beds", widget: "number", required: false }
              - { label: "Kort-bilde (vises på forsiden)", name: "image", widget: "image" }
              - label: "Bildegalleri (vises i «Se bilder»-modalen)"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "Bilde", name: "image", widget: "image" }

  # ---------------------------------------------------------------------------
  #  Nærområdet – FELLES for alle språk. src/data/nearby.json
  #  Stedsnavnene er EGENNAVN (Tūja, Veczemju klintis, Salacgrīva …) og ligger
  #  her BEVISST: denne collectionen har ingen `i18n`, så «Translate»-knappen
  #  ser den aldri og kan verken oversette navnene, fjerne diakritiske tegn
  #  eller bøye dem. Kun kategorinavn og en valgfri beskrivelse oversettes –
  #  de ligger under «I nærheten» i «Sideinnhold» og kobles hit via `id`.
  # ---------------------------------------------------------------------------
  - name: "nearby"
    label: "Nærområdet (steder, avstand og lenker)"
    files:
      - name: "nearby"
        label: "Butikker, spisesteder og aktiviteter"
        file: "src/data/nearby.json"
        fields:
          - label: "Steder"
            name: "places"
            widget: "list"
            required: false
            fields:
              - { label: "ID (må matche beskrivelsen i Sideinnhold)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "Kun små bokstaver, tall og bindestrek"] }
              - { label: "Navn (egennavn – skrives ÉN gang, oversettes aldri)", name: "name", widget: "string", hint: "Bruk stedets faktiske navn med riktige tegn, f.eks. «Veczemju klintis», «Tūja», «Salacgrīva»." }
              - { label: "Sted/område (valgfritt, f.eks. Salacgrīva)", name: "area", widget: "string", required: false }
              - { label: "Kategori", name: "category", widget: "select", options: ["shop", "restaurant", "activity"], default: "activity" }
              - { label: "Avstand i km (langs vei fra eiendommen)", name: "distanceKm", widget: "number", value_type: "float", min: 0, step: 0.1 }
              - { label: "Lenke til Google Maps (valgfri)", name: "url", widget: "string", required: false, hint: "Må starte med http:// eller https://. Lenk til selve stedet, ikke en kjørerute fra Klintskalni 1 – det ville røpe nøyaktig adresse." }

  # ---------------------------------------------------------------------------
  #  Bilder – FELLES for alle språk (kun alt-tekst oversettes, se Sideinnhold)
  #  src/data/media.json
  # ---------------------------------------------------------------------------
  - name: "media"
    label: "Bilder (felles for alle språk)"
    files:
      - name: "media"
        label: "Hero, karusell og delingsbilde"
        file: "src/data/media.json"
        fields:
          - { label: "Hero-bilde", name: "heroImage", widget: "image" }
          - { label: "Delingsbilde (Open Graph)", name: "ogImage", widget: "image", required: false }
          - label: "Karusellbilder («Omgivelsene» – ruller over skjermen)"
            name: "gallery"
            widget: "list"
            required: false
            field: { label: "Bilde", name: "image", widget: "image" }

  # ---------------------------------------------------------------------------
  #  Kontakt – FELLES for alle språk. src/data/contact.json
  # ---------------------------------------------------------------------------
  - name: "contact"
    label: "Kontakt (e-post)"
    files:
      - name: "contact"
        label: "E-postadresse"
        file: "src/data/contact.json"
        fields:
          - { label: "E-postadresse (felles for alle språk)", name: "email", widget: "string", required: false }

  # ---------------------------------------------------------------------------
  #  Anmeldelser (manuell kuratering) – src/content/reviews/reviews.json
  #  Filen er et objekt med én nøkkel: `reviews` (liste).
  # ---------------------------------------------------------------------------
  - name: "reviews"
    label: "Anmeldelser"
    files:
      - name: "reviews"
        label: "Kuraterte anmeldelser"
        file: "src/content/reviews/reviews.json"
        fields:
          - label: "Anmeldelser"
            name: "reviews"
            widget: "list"
            allow_add: true
            fields:
              - { label: "Sitat", name: "text", widget: "text" }
              - { label: "Fornavn", name: "author", widget: "string" }
              - { label: "Kilde", name: "source", widget: "select", options: ["Airbnb", "Google"], default: "Airbnb", required: false }
              - { label: "Stjerner", name: "rating", widget: "number", min: 1, max: 5, default: 5, required: false }
              - { label: "Dato (f.eks. 2025-08)", name: "date", widget: "string", required: false }

# =============================================================================
#  Sveltia CMS – konfigurasjon (jf. rapportens kap. 2.6)
# =============================================================================
#  Skjema-grensesnitt for å redigere tekst, bilder og anmeldelser i nettleseren.
#  Endringer lagres som vanlige Git-commits, som trigger Cloudflare-bygget.
#
#  VIKTIG, gjør dette selv:
#   1. Bytt `repo:` under til ditt GitHub-bruker/repo hvis det avviker.
#   2. Sett `branch:` til den grenen Cloudflare Pages bygger fra (oftest `main`).
#   3. Logg inn på /admin med et fine-grained Personal Access Token (PAT) som
#      KUN har tilgang til dette repoet, med "Contents: Read and write".
#      Tokenet lagres lokalt i nettleseren – det committes ALDRI til repoet.
# =============================================================================

backend:
  name: github
  repo: jorgenjj/klintskalni
  branch: main

# Bilder lastes opp hit (der Astro optimaliserer dem ved bygg).
media_folder: "src/images"
public_folder: "/src/images"

# Flerspråk-oppsett for redigeringsgrensesnittet.
i18n:
  structure: multiple_files
  locales: [en, no, lv]
  default_locale: en

collections:
  # ---------------------------------------------------------------------------
  #  Sideinnhold (tekst) per språk – src/content/sections/<lang>.md
  # ---------------------------------------------------------------------------
  - name: "sections"
    label: "Sideinnhold (tekst)"
    label_singular: "språkversjon"
    files:
      - name: "en"
        label: "English"
        file: "src/content/sections/en.md"
        fields: &section_fields
          - { label: "Hero – tittel", name: "heroTitle", widget: "string" }
          - { label: "Hero – undertekst", name: "heroTagline", widget: "string" }
          - { label: "Hero – bildebeskrivelse (alt)", name: "heroAlt", widget: "string", required: false }
          - { label: "Knapp: Book på Airbnb", name: "bookButtonLabel", widget: "string" }
          - { label: "Nøkkelpunkter – tittel", name: "keyPointsTitle", widget: "string", required: false }
          - label: "Nøkkelpunkter"
            name: "keyPoints"
            widget: "list"
            required: false
            fields:
              - { label: "Ikon (emoji)", name: "icon", widget: "string", default: "•" }
              - { label: "Tekst", name: "label", widget: "string" }
          - { label: "Galleri – tittel", name: "galleryTitle", widget: "string", required: false }
          - label: "Galleri – bildebeskrivelser (alt), i samme rekkefølge som bildene"
            name: "galleryAlts"
            widget: "list"
            required: false
            field: { label: "Bildebeskrivelse", name: "alt", widget: "string" }
          - { label: "Info – tittel", name: "infoTitle", widget: "string", required: false }
          - { label: "Anmeldelser – tittel", name: "reviewsTitle", widget: "string", required: false }
          - { label: "Anmeldelser – merknad (f.eks. ★ 4,9 på Airbnb)", name: "reviewsNote", widget: "string", required: false }
          - { label: "Anmeldelser – lenketekst", name: "reviewsLinkLabel", widget: "string", required: false }
          - { label: "Kart – tittel", name: "mapTitle", widget: "string", required: false }
          - { label: "Kart – områdenavn", name: "mapAreaLabel", widget: "string", required: false }
          - { label: "Kart – lenketekst", name: "mapLinkLabel", widget: "string", required: false }
          - { label: "Kontakt – tittel", name: "contactTitle", widget: "string", required: false }
          - { label: "Kontakt – tekst", name: "contactText", widget: "text", required: false }
          - { label: "Knapp: Send melding på Airbnb", name: "airbnbButtonLabel", widget: "string", required: false }
          - { label: "Knapp: Send e-post", name: "emailButtonLabel", widget: "string", required: false }
          - { label: "SEO – sidetittel", name: "seoTitle", widget: "string" }
          - { label: "SEO – beskrivelse", name: "seoDescription", widget: "text" }
          - { label: "Språkvelger-etikett", name: "languageLabel", widget: "string", required: false, default: "Language" }
          - { label: "«Hopp til innhold»-tekst", name: "skipToContent", widget: "string", required: false, default: "Skip to content" }
          - { label: "Lengre informasjonstekst (om huset)", name: "body", widget: "markdown" }
      - name: "no"
        label: "Norsk"
        file: "src/content/sections/no.md"
        fields: *section_fields
      - name: "lv"
        label: "Latviešu"
        file: "src/content/sections/lv.md"
        fields: *section_fields

  # ---------------------------------------------------------------------------
  #  Global konfig per språk – src/content/site/<lang>.json
  # ---------------------------------------------------------------------------
  - name: "site"
    label: "Innstillinger og bilder"
    files:
      - name: "en"
        label: "English"
        file: "src/content/site/en.json"
        fields: &site_fields
          - { label: "Husnavn", name: "houseName", widget: "string" }
          - { label: "Airbnb-lenke (annonsen)", name: "airbnbUrl", widget: "string" }
          - { label: "E-postadresse", name: "email", widget: "string", required: false }
          - { label: "Hero-bilde", name: "heroImage", widget: "image" }
          - { label: "Delingsbilde (Open Graph)", name: "ogImage", widget: "image", required: false }
          - label: "Galleribilder"
            name: "gallery"
            widget: "list"
            required: false
            field: { label: "Bilde", name: "image", widget: "image" }
          - label: "Kart"
            name: "map"
            widget: "object"
            fields:
              - { label: "Breddegrad (lat)", name: "lat", widget: "number", value_type: "float" }
              - { label: "Lengdegrad (lon)", name: "lon", widget: "number", value_type: "float" }
              - { label: "Områdestørrelse (grader)", name: "areaSpan", widget: "number", value_type: "float", default: 0.06 }
              - { label: "Vis nøyaktig nål?", name: "showMarker", widget: "boolean", default: false }
      - name: "no"
        label: "Norsk"
        file: "src/content/site/no.json"
        fields: *site_fields
      - name: "lv"
        label: "Latviešu"
        file: "src/content/site/lv.json"
        fields: *site_fields

  # ---------------------------------------------------------------------------
  #  Anmeldelser (manuell kuratering) – src/content/reviews/reviews.json
  # ---------------------------------------------------------------------------
  - name: "reviews"
    label: "Anmeldelser"
    files:
      - name: "reviews"
        label: "Kuraterte anmeldelser"
        file: "src/content/reviews/reviews.json"
        fields:
          - label: "Anmeldelser"
            name: "reviews"
            widget: "list"
            # Filen er en ren liste (JSON-array på toppnivå).
            allow_add: true
            fields:
              - { label: "Sitat", name: "text", widget: "text" }
              - { label: "Fornavn", name: "author", widget: "string" }
              - { label: "Kilde", name: "source", widget: "select", options: ["Airbnb", "Google"], default: "Airbnb", required: false }
              - { label: "Stjerner", name: "rating", widget: "number", min: 1, max: 5, default: 5, required: false }
              - { label: "Dato (f.eks. 2025-08)", name: "date", widget: "string", required: false }
